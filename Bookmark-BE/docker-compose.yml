version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bookmark_db
    restart: always
    environment:
      POSTGRES_DB: bookmark_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: bookmark_web
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: bookmark_redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: bookmark_celery_worker
    restart: always
    command: celery -A app.config.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: bookmark_celery_beat
    restart: always
    command: celery -A app.config.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ../Bookmark-FE
      dockerfile: Dockerfile
    container_name: bookmark_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v0
    depends_on:
      - web

volumes:
  postgres_data:
